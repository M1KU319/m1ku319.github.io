<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-labelledby="title desc">
<title id="title">Different matchings when prioritising profit or the number of pairs</title>
<desc id="desc">The candidate pair L1R1 gives profit 10; L1R2 and L2R1 each give profit 4. Each vertex can be matched at most once. To maximise total profit alone, choose L1R1: 1 pair with total profit 10. To maximise the number of pairs first and then profit, choose L1R2 and L2R1: 2 pairs with total profit 8.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#c86a16"/></marker></defs>
<rect width="820" height="620" rx="18" fill="#f5f8fc"/>
<g font-family="DejaVu Sans, system-ui, sans-serif">
<text x="30" y="43" font-size="28" fill="#172033" text-anchor="start" font-weight="700">More matches do not always mean more profit</text><text x="30" y="80" font-size="21" fill="#52627a" text-anchor="start" font-weight="400">Same three candidate edges; the choice depends on the objective.</text><rect x="18" y="104" width="382" height="414" rx="14" fill="white" stroke="#dce4ef"/><g transform="translate(18 104)"><text x="191" y="40" font-size="22" fill="#172033" text-anchor="middle" font-weight="600">Maximise total profit</text><path d="M 88.0 131.0 L 291.0 131.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M 88.0 287.0 L 291.0 287.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M 84.3 144.0 L 295.1 272.4" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><rect x="170.0" y="98" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="119" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="500">4</text><rect x="170.0" y="254" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="275" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="500">4</text><rect x="168.7" y="196" width="44.6" height="29" rx="7" fill="#fff"/><text x="191" y="217" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">10</text><circle cx="63" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₁</text><circle cx="63" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₂</text><circle cx="319" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₂</text><circle cx="319" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₁</text><text x="191" y="357" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="600">1 pair · total profit 10</text><text x="191" y="391" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">Choose L₁R₁</text></g><rect x="420" y="104" width="382" height="414" rx="14" fill="white" stroke="#dce4ef"/><g transform="translate(420 104)"><text x="191" y="40" font-size="22" fill="#172033" text-anchor="middle" font-weight="600">Maximise pairs, then profit</text><path d="M 88.0 131.0 L 291.0 131.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M 88.0 287.0 L 291.0 287.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M 84.3 144.0 L 295.1 272.4" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="170.0" y="98" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="119" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">4</text><rect x="170.0" y="254" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="275" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">4</text><rect x="168.7" y="196" width="44.6" height="29" rx="7" fill="#fff"/><text x="191" y="217" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="500">10</text><circle cx="63" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₁</text><circle cx="63" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₂</text><circle cx="319" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₂</text><circle cx="319" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₁</text><text x="191" y="357" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="600">2 pairs · total profit 8</text><text x="191" y="391" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">Choose L₁R₂ and L₂R₁</text></g><text x="410" y="558" font-size="21" fill="#52627a" text-anchor="middle" font-weight="400">Edge labels show profit. Blue: selected. Grey: not selected.</text><text x="410" y="593" font-size="21" fill="#52627a" text-anchor="middle" font-weight="400">Switch to two pairs: remove 10, add 4 + 4. Profit falls by 2.</text>
</g>
</svg>
