<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="820" height="530" role="img" aria-labelledby="title desc">
<title id="title">二分图匹配的网络流建模</title>
<desc id="desc">源点 s 连向左部 L1、L2，右部 R1、R2 连向汇点 t。允许的配对只有 L1R1、L1R2、L2R1，所有原边容量为 1。图中右部将 R2 放在 R1 上方，以便突出最大匹配 L1R2 和 L2R1。蓝色的两条源汇路径各有流量 1，总流量为 2。只画原边，不画残量反边。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#c86a16"/></marker></defs>
<rect width="820" height="530" rx="18" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, system-ui, sans-serif">
<text x="30" y="43" font-size="28" fill="#172033" text-anchor="start" font-weight="700">二分图匹配的网络流建模</text><text x="30" y="79" font-size="21" fill="#52627a" text-anchor="start" font-weight="400">仅画原边；所有原边容量均为 1。</text><text x="272" y="120" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">左部</text><text x="538" y="120" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">右部</text><path d="M 292.6 178.2 L 515.0 332.1" fill="none" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#gray)"/><path d="M 100.5 246.2 L 246.8 176.1" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 100.6 267.6 L 246.7 336.1" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 297.0 164.0 L 510.0 164.0" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 297.0 348.0 L 510.0 348.0" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 560.8 337.8 L 716.4 268.4" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 560.7 174.4 L 716.5 245.4" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><rect x="384.0" y="130" width="42.0" height="29" rx="7" fill="#fff"/><text x="405" y="151" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">选中</text><rect x="384.0" y="314" width="42.0" height="29" rx="7" fill="#fff"/><text x="405" y="335" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">选中</text><rect x="384.0" y="242" width="42.0" height="29" rx="7" fill="#fff"/><text x="405" y="263" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="500">未选</text><circle cx="78" cy="257" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="78" y="265" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">s</text><circle cx="272" cy="164" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="272" y="172" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₁</text><circle cx="272" cy="348" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="272" y="356" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₂</text><circle cx="538" cy="164" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="538" y="172" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₂</text><circle cx="538" cy="348" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="538" y="356" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₁</text><circle cx="742" cy="257" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="742" y="265" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">t</text><text x="410" y="422" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">最大匹配：L₁R₂、L₂R₁</text><text x="410" y="461" font-size="21" fill="#52627a" text-anchor="middle" font-weight="400">两条源汇路径，各送 1 单位，总流量为 2。</text><text x="410" y="500" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">蓝色原边有流量，灰色配对边流量为 0。</text>
</g>
</svg>
