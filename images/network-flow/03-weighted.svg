<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-labelledby="title desc">
<title id="title">收益优先与数量优先的不同匹配</title>
<desc id="desc">候选配对 L1R1 收益 10，L1R2 和 L2R1 收益各 4。每个点至多匹配一次。若只求总收益最大，选 L1R1，匹配数为 1，总收益 10。若先要求匹配数最多，再最大化收益，则选 L1R2 和 L2R1，匹配数为 2，总收益 8。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#c86a16"/></marker></defs>
<rect width="820" height="620" rx="18" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, system-ui, sans-serif">
<text x="30" y="43" font-size="28" fill="#172033" text-anchor="start" font-weight="700">匹配数最多，不一定总收益最高</text><text x="30" y="80" font-size="21" fill="#52627a" text-anchor="start" font-weight="400">三条候选边相同，选择取决于优化目标。</text><rect x="18" y="104" width="382" height="414" rx="14" fill="white" stroke="#dce4ef"/><g transform="translate(18 104)"><text x="191" y="40" font-size="22" fill="#172033" text-anchor="middle" font-weight="600">只求总收益最大</text><path d="M 88.0 131.0 L 291.0 131.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M 88.0 287.0 L 291.0 287.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M 84.3 144.0 L 295.1 272.4" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><rect x="170.0" y="98" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="119" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="500">4</text><rect x="170.0" y="254" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="275" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="500">4</text><rect x="168.7" y="196" width="44.6" height="29" rx="7" fill="#fff"/><text x="191" y="217" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">10</text><circle cx="63" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₁</text><circle cx="63" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₂</text><circle cx="319" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₂</text><circle cx="319" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₁</text><text x="191" y="357" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="600">1 对 · 总收益 10</text><text x="191" y="391" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">选 L₁R₁</text></g><rect x="420" y="104" width="382" height="414" rx="14" fill="white" stroke="#dce4ef"/><g transform="translate(420 104)"><text x="191" y="40" font-size="22" fill="#172033" text-anchor="middle" font-weight="600">先选最多，再求收益最大</text><path d="M 88.0 131.0 L 291.0 131.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M 88.0 287.0 L 291.0 287.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M 84.3 144.0 L 295.1 272.4" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="170.0" y="98" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="119" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">4</text><rect x="170.0" y="254" width="42.0" height="29" rx="7" fill="#fff"/><text x="191" y="275" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">4</text><rect x="168.7" y="196" width="44.6" height="29" rx="7" fill="#fff"/><text x="191" y="217" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="500">10</text><circle cx="63" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₁</text><circle cx="63" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="63" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₂</text><circle cx="319" cy="131" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="139" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₂</text><circle cx="319" cy="287" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="319" y="295" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₁</text><text x="191" y="357" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="600">2 对 · 总收益 8</text><text x="191" y="391" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">选 L₁R₂ 和 L₂R₁</text></g><text x="410" y="558" font-size="21" fill="#52627a" text-anchor="middle" font-weight="400">边上数字表示收益；蓝色选中，灰色未选。</text><text x="410" y="593" font-size="21" fill="#52627a" text-anchor="middle" font-weight="400">改选两对：撤销收益 10，新增 4 + 4，总收益减少 2。</text>
</g>
</svg>
