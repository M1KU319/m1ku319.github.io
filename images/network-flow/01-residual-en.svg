<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1050" width="820" height="1050" role="img" aria-labelledby="title desc">
<title id="title">Two augmentations and reverse edges</title>
<desc id="desc">The original graph has five edges of capacity 1: s to a, s to b, a to b, a to t, and b to t. First, send 1 unit along s to a to b to t. Next, augment by 1 along the residual path s to b to a to t, using b to a to undo the flow on a to b. The final original flow uses s to a to t and s to b to t, each carrying 1 unit. The flow on a to b is 0 and the total flow is 2.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb" /></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#c86a16" /></marker></defs>
<rect width="820" height="1050" rx="18" fill="#f5f8fc" />
<g font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, system-ui, sans-serif">
<text x="30" y="43" font-size="28" fill="#172033" text-anchor="start" font-weight="700">Two augmentations and reverse edges</text><text x="30" y="75" font-size="20" fill="#52627a" text-anchor="start" font-weight="400">Every original edge has capacity 1. Reverse edges undo earlier flow.</text><rect x="18" y="96" width="784" height="300" rx="14" fill="#fff" stroke="#dce4ef" /><g transform="translate(18 96)"><text x="24" y="37" font-size="23" fill="#172033" text-anchor="start" font-weight="600">1. After the first augmentation: original flow</text><path d="M 103.7 157.1 L 248.4 108.9" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="133.5" y="91" width="81.0" height="29" rx="7" fill="#fff" /><text x="174" y="112" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><path d="M 103.5 173.4 L 248.6 225.5" fill="none" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round" marker-end="url(#gray)" /><rect x="133.5" y="209" width="81.0" height="29" rx="7" fill="#fff" /><text x="174" y="230" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="500">0 / 1</text><path d="M 275.0 125.0 L 275.0 207.0" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="267.5" y="153" width="81.0" height="29" rx="7" fill="#fff" /><text x="308" y="174" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><path d="M 298.7 107.9 L 443.4 156.1" fill="none" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round" marker-end="url(#gray)" /><rect x="335.5" y="91" width="81.0" height="29" rx="7" fill="#fff" /><text x="376" y="112" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="500">0 / 1</text><path d="M 298.5 226.6 L 443.6 174.5" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="335.5" y="209" width="81.0" height="29" rx="7" fill="#fff" /><text x="376" y="230" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><text x="535" y="115" font-size="25" fill="#2563eb" text-anchor="start" font-weight="600">Flow = 1</text><text x="535" y="158" font-size="21" fill="#172033" text-anchor="start" font-weight="500">s → a → b → t</text><text x="535" y="208" font-size="20" fill="#52627a" text-anchor="start" font-weight="400">a → b carries 1</text><text x="24" y="281" font-size="19" fill="#52627a" text-anchor="start" font-weight="400">Labels: flow / capacity. Only original edges are shown.</text><circle cx="80" cy="165" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="80" y="173" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">s</text><circle cx="275" cy="100" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="275" y="108" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">a</text><circle cx="275" cy="235" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="275" y="243" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">b</text><circle cx="470" cy="165" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="470" y="173" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">t</text></g><rect x="18" y="414" width="784" height="300" rx="14" fill="#fff" stroke="#dce4ef" /><g transform="translate(18 414)"><text x="24" y="37" font-size="23" fill="#172033" text-anchor="start" font-weight="600">2. Second augmentation: a residual path</text><path d="M 103.5 173.4 L 248.6 225.5" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><path d="M 275.0 210.0 L 275.0 128.0" fill="none" stroke="#c86a16" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#orange)" /><path d="M 298.7 107.9 L 443.4 156.1" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="153.0" y="209" width="42.0" height="29" rx="7" fill="#fff" /><text x="174" y="230" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1</text><rect x="355.0" y="91" width="42.0" height="29" rx="7" fill="#fff" /><text x="376" y="112" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1</text><rect x="287.0" y="153" width="42.0" height="29" rx="7" fill="#fff" /><text x="308" y="174" font-size="20" fill="#c86a16" text-anchor="middle" font-weight="500">1</text><text x="535" y="115" font-size="21" fill="#172033" text-anchor="start" font-weight="600">s → b → a → t</text><text x="535" y="155" font-size="18" fill="#c86a16" text-anchor="start" font-weight="400">b → a is a reverse edge</text><text x="535" y="191" font-size="20" fill="#c86a16" text-anchor="start" font-weight="400">Undo 1 on a → b</text><text x="535" y="232" font-size="18" fill="#2563eb" text-anchor="start" font-weight="600">Total flow increases by 1</text><text x="24" y="281" font-size="19" fill="#52627a" text-anchor="start" font-weight="400">Only this augmenting path is shown; labels are residual capacities.</text><circle cx="80" cy="165" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="80" y="173" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">s</text><circle cx="275" cy="100" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="275" y="108" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">a</text><circle cx="275" cy="235" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="275" y="243" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">b</text><circle cx="470" cy="165" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="470" y="173" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">t</text></g><rect x="18" y="732" width="784" height="300" rx="14" fill="#fff" stroke="#dce4ef" /><g transform="translate(18 732)"><text x="24" y="37" font-size="23" fill="#172033" text-anchor="start" font-weight="600">3. After both augmentations: original flow</text><path d="M 103.7 157.1 L 248.4 108.9" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="133.5" y="91" width="81.0" height="29" rx="7" fill="#fff" /><text x="174" y="112" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><path d="M 103.5 173.4 L 248.6 225.5" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="133.5" y="209" width="81.0" height="29" rx="7" fill="#fff" /><text x="174" y="230" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><path d="M 275.0 125.0 L 275.0 207.0" fill="none" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round" marker-end="url(#gray)" /><rect x="267.5" y="153" width="81.0" height="29" rx="7" fill="#fff" /><text x="308" y="174" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="500">0 / 1</text><path d="M 298.7 107.9 L 443.4 156.1" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="335.5" y="91" width="81.0" height="29" rx="7" fill="#fff" /><text x="376" y="112" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><path d="M 298.5 226.6 L 443.6 174.5" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)" /><rect x="335.5" y="209" width="81.0" height="29" rx="7" fill="#fff" /><text x="376" y="230" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">1 / 1</text><text x="535" y="115" font-size="25" fill="#2563eb" text-anchor="start" font-weight="600">Flow = 2</text><text x="535" y="158" font-size="21" fill="#172033" text-anchor="start" font-weight="500">s → a → t</text><text x="535" y="195" font-size="21" fill="#172033" text-anchor="start" font-weight="500">s → b → t</text><text x="535" y="238" font-size="20" fill="#52627a" text-anchor="start" font-weight="400">a → b ends with 0</text><text x="24" y="281" font-size="19" fill="#52627a" text-anchor="start" font-weight="400">Labels: flow / capacity. Only original edges are shown.</text><circle cx="80" cy="165" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="80" y="173" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">s</text><circle cx="275" cy="100" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="275" y="108" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">a</text><circle cx="275" cy="235" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="275" y="243" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">b</text><circle cx="470" cy="165" r="23" fill="white" stroke="#40516c" stroke-width="2.5" /><text x="470" y="173" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">t</text></g>
</g>
</svg>
