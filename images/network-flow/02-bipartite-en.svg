<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="820" height="530" role="img" aria-labelledby="title desc">
<title id="title">Modelling bipartite matching with network flow</title>
<desc id="desc">Source s connects to left vertices L1 and L2, while right vertices R1 and R2 connect to sink t. The only allowed pairs are L1R1, L1R2 and L2R1, and every original edge has capacity 1. R2 is placed above R1 to highlight the maximum matching L1R2 and L2R1. Each blue source-to-sink path carries 1 unit of flow, giving a total flow of 2. Only original edges are shown; reverse residual edges are omitted.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#c86a16"/></marker></defs>
<rect width="820" height="530" rx="18" fill="#f5f8fc"/>
<g font-family="DejaVu Sans, system-ui, sans-serif">
<text x="30" y="43" font-size="26" fill="#172033" text-anchor="start" font-weight="700">Modelling bipartite matching with network flow</text><text x="30" y="79" font-size="21" fill="#52627a" text-anchor="start" font-weight="400">Only original edges are shown; each has capacity 1.</text><text x="272" y="120" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">Left side</text><text x="538" y="120" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">Right side</text><path d="M 292.6 178.2 L 515.0 332.1" fill="none" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#gray)"/><path d="M 100.5 246.2 L 246.8 176.1" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 100.6 267.6 L 246.7 336.1" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 297.0 164.0 L 510.0 164.0" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 297.0 348.0 L 510.0 348.0" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 560.8 337.8 L 716.4 268.4" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><path d="M 560.7 174.4 L 716.5 245.4" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" marker-end="url(#blue)"/><rect x="360.0" y="130" width="90.0" height="29" rx="7" fill="#fff"/><text x="405" y="151" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">Chosen</text><rect x="360.0" y="314" width="90.0" height="29" rx="7" fill="#fff"/><text x="405" y="335" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="500">Chosen</text><rect x="360.0" y="242" width="90.0" height="29" rx="7" fill="#fff"/><text x="405" y="263" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="500">Unused</text><circle cx="78" cy="257" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="78" y="265" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">s</text><circle cx="272" cy="164" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="272" y="172" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₁</text><circle cx="272" cy="348" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="272" y="356" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">L₂</text><circle cx="538" cy="164" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="538" y="172" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₂</text><circle cx="538" cy="348" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="538" y="356" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">R₁</text><circle cx="742" cy="257" r="23" fill="white" stroke="#40516c" stroke-width="2.5"/><text x="742" y="265" font-size="24" fill="#172033" text-anchor="middle" font-weight="600">t</text><text x="410" y="422" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">Maximum matching: L₁R₂ and L₂R₁</text><text x="410" y="461" font-size="21" fill="#52627a" text-anchor="middle" font-weight="400">Two source-to-sink paths, 1 unit each: total flow = 2.</text><text x="410" y="500" font-size="20" fill="#52627a" text-anchor="middle" font-weight="400">Blue edges carry flow; the grey pairing edge carries 0.</text>
</g>
</svg>
